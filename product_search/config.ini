# ⚙️ Configuración del Módulo - Búsqueda Inteligente de Productos

# ============================================
# CONFIGURACIÓN DE DESARROLLO
# ============================================

[development]
# Configuración para entorno de desarrollo
debug_mode = True
max_results = 20
enable_learning = True
interaction_threshold = 20
cache_enabled = False
log_level = DEBUG
test_data_enabled = True

# Configuración de IA y ML
ai_confidence_threshold = 0.7
learning_batch_size = 10
pattern_similarity_threshold = 0.3

# Configuración de UI
enable_animations = True
show_debug_info = True
conversation_timeout = 300  # 5 minutos

# ============================================
# CONFIGURACIÓN DE PRODUCCIÓN
# ============================================

[production]
# Configuración para entorno de producción
debug_mode = False
max_results = 50
enable_learning = True
interaction_threshold = 30
cache_enabled = True
log_level = INFO
test_data_enabled = False

# Configuración de IA y ML
ai_confidence_threshold = 0.8
learning_batch_size = 50
pattern_similarity_threshold = 0.4

# Configuración de UI
enable_animations = True
show_debug_info = False
conversation_timeout = 600  # 10 minutos

# ============================================
# CONFIGURACIÓN DE TESTING
# ============================================

[testing]
# Configuración para tests automatizados
debug_mode = True
max_results = 10
enable_learning = False
interaction_threshold = 15
cache_enabled = False
log_level = DEBUG
test_data_enabled = True

# Configuración específica para tests
auto_create_test_products = True
mock_ai_responses = True
skip_external_apis = True

# ============================================
# PARÁMETROS CONFIGURABLES VIA ODOO
# ============================================

# Estos parámetros se pueden configurar desde:
# Configuración → Técnico → Parámetros del Sistema

# Búsqueda y resultados
product_search.max_results = 50
product_search.enable_fuzzy_search = True
product_search.search_timeout = 30
product_search.min_query_length = 3

# Sistema conversacional
product_search.enable_conversation = True
product_search.max_questions = 5
product_search.conversation_timeout = 600
product_search.auto_finish_threshold = 0.9

# Aprendizaje automático
product_search.enable_learning = True
product_search.min_pattern_usage = 3
product_search.pattern_expiry_days = 365
product_search.learning_batch_size = 25

# Detección automática
product_search.brand_detection_enabled = True
product_search.category_detection_enabled = True
product_search.confidence_threshold = 0.6
product_search.detection_timeout = 5

# Rendimiento y caché
product_search.cache_enabled = True
product_search.cache_expiry_minutes = 60
product_search.max_concurrent_searches = 10
product_search.query_optimization = True

# Interfaz de usuario
product_search.enable_animations = True
product_search.theme_mode = auto  # auto, light, dark
product_search.results_per_page = 20
product_search.enable_infinite_scroll = True

# Seguridad
product_search.rate_limit_per_user = 100  # por hora
product_search.log_user_queries = True
product_search.anonymize_logs = False
product_search.session_timeout = 3600

# Integración con otros módulos
product_search.sale_integration = True
product_search.inventory_integration = True
product_search.crm_integration = False
product_search.website_integration = False

# Notificaciones
product_search.enable_notifications = True
product_search.notify_admin_errors = True
product_search.notify_learning_milestones = False
product_search.email_notifications = False

# ============================================
# CONFIGURACIÓN AVANZADA
# ============================================

# Machine Learning
[ml_config]
algorithm = hybrid  # keyword, semantic, hybrid
embedding_model = sentence-transformers
similarity_metric = cosine
training_frequency = weekly
model_update_threshold = 100

# Base de datos
[database]
use_full_text_search = True
create_indexes = True
optimize_queries = True
connection_pooling = True

# APIs externas (para futuras integraciones)
[external_apis]
openai_enabled = False
openai_api_key = 
openai_model = gpt-3.5-turbo
translation_service = 
image_recognition_api = 

# Monitoreo y logs
[monitoring]
enable_metrics = True
metrics_retention_days = 90
performance_tracking = True
error_reporting = True
usage_analytics = True

