# ============================================
# NOTAS DE CONFIGURACIÓN
# ============================================

# 1. Los valores por defecto están optimizados para producción
# 2. En desarrollo, reducir timeouts y límites para testing rápido
# 3. El aprendizaje automático requiere datos históricos suficientes
# 4. El caché mejora rendimiento pero usa más memoria
# 5. Las animaciones pueden afectar rendimiento en dispositivos lentos

# ============================================
# CONFIGURACIÓN POR EMPRESA/TENANT
# ============================================

# Para configuraciones específicas por empresa:
# Ir a Configuración → Empresas → [Seleccionar Empresa]
# Agregar configuraciones en el campo 'Notas' usando formato:
# product_search_config = {
#     'max_results': 30,
#     'enable_conversation': True,
#     'theme': 'dark'
# }

# ============================================
# MIGRACIÓN DE CONFIGURACIONES
# ============================================

# Al actualizar versiones, verificar:
# 1. Nuevos parámetros de configuración
# 2. Parámetros obsoletos o renombrados  
# 3. Valores por defecto modificados
# 4. Compatibilidad con configuración existente

# ============================================
# TROUBLESHOOTING CONFIGURACIÓN
# ============================================

# Problema: Búsquedas lentas
# Solución: Aumentar product_search.search_timeout
#          Habilitar product_search.cache_enabled
#          Verificar product_search.query_optimization

# Problema: Muchas conversaciones innecesarias
# Solución: Aumentar product_search.confidence_threshold
#          Reducir product_search.interaction_threshold

# Problema: Aprendizaje no mejora
# Solución: Verificar product_search.enable_learning
#          Aumentar product_search.learning_batch_size
#          Revisar product_search.min_pattern_usage